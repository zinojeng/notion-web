name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - uses: actions/upload-artifact@v4
        with:
          name: notion-web-safari
          path: dist/safari/
      - uses: actions/upload-artifact@v4
        with:
          name: notion-web-chromium
          path: dist/chromium/
